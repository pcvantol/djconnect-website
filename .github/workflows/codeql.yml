name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "24 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@aabd5de46ae438478eb894707e5b1ea27aca8508
    with:
      execution_profile: balanced
      owner: djconnect-music-dj/djconnect-website

  analyze:
    name: Analyze
    needs: software-assurance-governance
    runs-on: ubuntu-latest
    steps:
      # Same pinned scanner and default query suite as the canonical reusable
      # workflow. Local configuration only fences the immutable source archive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: javascript-typescript
          config-file: .github/codeql/website.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
