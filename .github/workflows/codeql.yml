name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "24 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@dd02d6470f061e6e755e6fb47ae5331c34f89875
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect-website

  analyze:
    name: Analyze
    needs: software-assurance-governance
    runs-on: ubuntu-latest
    steps:
      # Same pinned scanner and default query suite as the canonical reusable
      # workflow. Local configuration only fences the immutable source archive.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
        with:
          languages: javascript-typescript
          config-file: .github/codeql/website.yml
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
