name: Post-Merge Release Evidence

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: pcvantol/djconnect/.github/workflows/post-merge-release-evidence.yml@659bfe752dff0dcdcdbfc475be52bdf69090e085
    with:
      policy_source_ref: baac22d771bf3141404001517f62a5e34f8c8644
      required_main_workflow: Validate
      required_check_contexts: '["Trusted Delivery qualification / Qualify trusted delivery"]'
      repository_role: active_source
      coverage_artifact_name: website-cobertura-coverage
      durable_evidence_release_tag_prefix: internal-website
