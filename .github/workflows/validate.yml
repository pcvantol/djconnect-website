name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@dd02d6470f061e6e755e6fb47ae5331c34f89875
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect-website

  website:
    name: Website quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check third-party packages and tools
        run: npm run deps:check

      - name: Run regression and content checks
        run: npm test

      - name: Generate post-merge coverage evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm run test:coverage
          printf '%s\n' "$GITHUB_SHA" > coverage-main-sha.txt

      - name: Upload post-merge coverage evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: website-cobertura-coverage
          path: |
            coverage/cobertura-coverage.xml
            coverage-main-sha.txt
          if-no-files-found: error

      - name: Build release site
        run: npm run build:release

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate all localized page screenshots
        run: npm run screenshots:all

      - name: Run local browser smoke tests
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173
        run: |
          node <<'NODE' &
          const http = require("node:http");
          const fs = require("node:fs");
          const path = require("node:path");

          const root = path.join(process.cwd(), "dist", "wwwroot");
          const types = {
            ".css": "text/css; charset=utf-8",
            ".html": "text/html; charset=utf-8",
            ".js": "text/javascript; charset=utf-8",
            ".json": "application/json; charset=utf-8",
            ".png": "image/png",
            ".svg": "image/svg+xml",
            ".txt": "text/plain; charset=utf-8",
            ".xml": "application/xml; charset=utf-8"
          };

          const server = http.createServer((req, res) => {
            const url = new URL(req.url, "http://127.0.0.1:4173");
            let pathname = decodeURIComponent(url.pathname);
            if (pathname === "/") pathname = "/index.html";
            let filePath = path.join(root, pathname);
            if (!path.extname(filePath) && fs.existsSync(`${filePath}.html`)) {
              filePath = `${filePath}.html`;
            }
            if (!filePath.startsWith(root) || !fs.existsSync(filePath) || fs.statSync(filePath).isDirectory()) {
              res.writeHead(404, { "content-type": "text/plain; charset=utf-8" });
              res.end("not found");
              return;
            }
            res.writeHead(200, { "content-type": types[path.extname(filePath)] || "application/octet-stream" });
            fs.createReadStream(filePath).pipe(res);
          });

          server.listen(4173, "127.0.0.1", () => console.log("Serving dist/wwwroot on http://127.0.0.1:4173"));
          NODE
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:4173
          npm run test:smoke

  cleanup-workflow-runs:
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    needs:
      - software-assurance-governance
      - website
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_RUNS: "2"
    steps:
      - name: Delete old completed workflow runs
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          current_run_id="${GITHUB_RUN_ID}"
          current_workflow_id="$(gh api "/repos/${repo}/actions/runs/${current_run_id}" --jq '.workflow_id')"

          gh api "/repos/${repo}/actions/workflows" --paginate --jq '.workflows[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r workflow_id workflow_name; do
            [ -n "${workflow_id}" ] || continue

            keep_limit="${KEEP_RUNS}"
            active_run_count="$(
              {
                gh api "/repos/${repo}/actions/workflows/${workflow_id}/runs?status=queued&per_page=100" \
                  --paginate \
                  --jq '.workflow_runs[] | .id'
                gh api "/repos/${repo}/actions/workflows/${workflow_id}/runs?status=in_progress&per_page=100" \
                  --paginate \
                  --jq '.workflow_runs[] | .id'
              } | awk -v current_run_id="${current_run_id}" '$0 != current_run_id { count++ } END { print count + 0 }'
            )"

            if [ "${workflow_id}" = "${current_workflow_id}" ] || [ "${active_run_count}" -gt 0 ]; then
              keep_limit=$((KEEP_RUNS - 1))
            fi

            deleted_count=0
            mapfile -t run_ids < <(
              gh api "/repos/${repo}/actions/workflows/${workflow_id}/runs?status=completed&per_page=100" \
                --paginate \
                --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id'
            )

            if ((${#run_ids[@]} <= keep_limit)); then
              echo "Workflow '${workflow_name}' (${workflow_id}): no completed runs to delete."
              continue
            fi

            for index in "${!run_ids[@]}"; do
              run_id="${run_ids[$index]}"
              if ((index < keep_limit)) || [ "${run_id}" = "${current_run_id}" ]; then
                continue
              fi

              if ! delete_error="$(gh api --method DELETE "/repos/${repo}/actions/runs/${run_id}" 2>&1)"; then
                if grep -q 'HTTP 404' <<<"${delete_error}"; then
                  echo "Workflow run ${run_id} was already deleted; continuing."
                  continue
                fi
                printf '%s\n' "${delete_error}" >&2
                exit 1
              fi
              deleted_count=$((deleted_count + 1))
            done

            echo "Workflow '${workflow_name}' (${workflow_id}): deleted ${deleted_count} completed runs older than the effective keep limit ${keep_limit}."
          done
