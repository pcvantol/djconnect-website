name: Website Pages read-only readiness
on:
  push:
    branches: [codex/website-premium-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-production-boundary:
    if: github.repository == 'pcvantol/djconnect-website' && github.actor == 'pcvantol'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/cloudflare-readback.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Read canonical production identity and automatic publication policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-readback.mjs cloudflare-readiness.json
      - name: Retain only whitelisted identity and policy fields
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cloudflare-readiness
          path: cloudflare-readiness.json
          if-no-files-found: warn
