name: Website Cloudflare policy read-only readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-readback:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.repository_id == '1265889311' &&
      github.repository == 'djconnect-music-dj/djconnect-website' && github.actor_id == '19624891'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/cloudflare-policy-readback.mjs
            scripts/cloudflare-policy-driver.mjs
            scripts/cloudflare-policy-output.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Read only existing token policy without persisting response
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-policy-driver.mjs
